name: Install Gradle wrapper
on:
  push:
    branches: [rebuild/native-from-scratch]
    paths: [.github/workflows/install-gradle-wrapper.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin
      - name: Commit verified wrapper files
        run: |
          chmod +x gradlew
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo 'Gradle wrapper already installed'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: install reproducible Gradle 8.14.3 wrapper'
            git push origin HEAD:rebuild/native-from-scratch
          fi
