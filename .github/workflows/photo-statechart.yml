name: Photo selection statechart
on:
  push:
    branches: [rebuild/native-from-scratch]
    paths:
      - "formal/PhotoSelection*"
      - "formal/photo-view.mjs"
      - "scripts/verify-photo-statechart.sh"
      - ".github/workflows/photo-statechart.yml"
      - "app/src/main/java/dev/doubtbuddy/ui/AskScreen.kt"
      - "ios/DoubtBuddy/AskView.swift"
  workflow_dispatch:
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/verify-photo-statechart.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-statechart
          path: evidence/photo-statechart/**
