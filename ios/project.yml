name: DoubtBuddy
options:
  bundleIdPrefix: dev.doubtbuddy
targets:
  DoubtBuddy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DoubtBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.doubtbuddy.ios
        INFOPLIST_FILE: DoubtBuddy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
